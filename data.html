<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vala Projects</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#f4f1f1;
    height:100vh;
    overflow:hidden;
}

.hero{
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    padding-left:25px;
}

.left{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
}

/* TITLE */

.left h1{
    font-size:100px;
    font-weight:900;
    line-height:0.85;
    letter-spacing:-5px;
    color:#111;

    /* Soft shadow behind text */
    text-shadow:
        4px 4px 0 rgba(0,0,0,0.06),
        10px 10px 25px rgba(0,0,0,0.12);
}

/* PREMIUM BUTTON */

.btn{
    margin-top:30px;
    width:240px;
    height:65px;
    border:none;
    border-radius:60px;
    cursor:pointer;
    position:relative;
    overflow:hidden;

    background:linear-gradient(
        135deg,
        #000,
        #232323,
        #000
    );

    color:white;
    font-size:18px;
    font-weight:800;
    letter-spacing:0.5px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    box-shadow:
        0 15px 30px rgba(0,0,0,.20),
        0 5px 12px rgba(0,0,0,.10),
        inset 0 1px 1px rgba(255,255,255,.20);

    transition:all .4s ease;
}

/* glowing border */

.btn::after{
    content:"";
    position:absolute;
    inset:2px;
    border-radius:60px;
    border:1px solid rgba(255,255,255,.15);
}

/* shine effect */

.btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:60%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );
    transform:skewX(-25deg);
}

.btn:hover::before{
    left:160%;
    transition:1s;
}

.btn:hover{
    transform:translateY(-6px) scale(1.03);

    box-shadow:
        0 22px 45px rgba(0,0,0,.30),
        0 10px 20px rgba(0,0,0,.15);
}

.btn svg{
    width:22px;
    height:22px;
    transition:.35s;
}

.btn:hover svg{
    transform:translateX(8px);
}

/* Mobile */

@media(max-width:900px){

    body{
        overflow:auto;
    }

    .hero{
        padding:25px;
    }

    .left h1{
        font-size:70px;
        letter-spacing:-3px;
    }

    .btn{
        width:210px;
        height:58px;
        font-size:16px;
    }
}

</style>
</head>
<body>

<section class="hero">

    <div class="left">

        <h1>
            Vala<br>
            Projects
        </h1>

        <button class="btn">
            Projects

            <svg fill="none"
                 stroke="currentColor"
                 stroke-width="2.5"
                 viewBox="0 0 24 24">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M5 12h14M13 5l7 7-7 7"/>
            </svg>

        </button>

    </div>

</section>

</body>
</html>
